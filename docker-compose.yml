
services:
  nginx:
    image: nginx
    container_name: nginx
    build: ./nginx
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend
  backend:
    image: backend
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.be
    env_file:
      - .env
    volumes:
      - ./backend_dir/scacchi:/app
      - /app/node_modules
  frontend:
    image: frontend
    container_name: frontend
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.fe
    volumes:
      - ./frontend_dir:/app
      - /app/node_modules
  vault:
    container_name: vault
    build: ./vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/keys:/vault/keys
      - vault-data:/vault/data:rw
      - vault-logs:/vault/logs
      # - ./vault/certs:/vault/certs:ro
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_API_ADDR=http://127.0.0.1:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local