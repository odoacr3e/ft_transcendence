
services:
  nginx:
    image: nginx
    container_name: nginx
    build: ./nginx
    ports:
      - "8000:443"
    depends_on:
      - backend
      - frontend
  backend:
    image: backend
    container_name: backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - VAULT_ADDR=http://vault:8200
    volumes:
      - vault-shared:/vault/shared
      # - ./backend_dir/scacchi:/app
      # - /app/node_modules
  frontend:
    image: frontend
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # volumes:
    #   - ./frontend_dir:/app
    #   - /app/node_modules
  postgres:
    container_name: postgres
    build: ./postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VAULT_ADDR=http://vault:8200
    volumes:
      - vault-shared:/vault/shared
      - postgres-data:/var/lib/postgresql/data
  # Il profilo "vault" e' attivato dal Makefile quando VAULT_ENABLED=true nel .env.
  # Senza profilo attivo il container non viene nemmeno creato: niente build, niente
  # healthcheck, niente attesa all'avvio. L'ordinamento con postgres non e' piu' un
  # depends_on ma un'attesa dentro il suo entrypoint, che vale solo quando serve.
  vault:
    container_name: vault
    build: ./vault
    restart: unless-stopped
    profiles:
      - vault
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/keys:/vault/keys
      - vault-data:/vault/data:rw
      - vault-logs:/vault/logs
      - vault-shared:/vault/shared
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_API_ADDR=http://127.0.0.1:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local
  vault-shared:
  postgres-data:
    driver: local
