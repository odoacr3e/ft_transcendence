
services:
  backend:
    image: backend
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.be
    env_file:
      - .env
    volumes:
      - ./backend/scacchi:/app
      - /app/node_modules

  frontend:
    image: frontend
    container_name: frontend
    ports:
      - "5173:5173"
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.fe
    volumes:
      - ./frontend:/app
      - /app/node_modules