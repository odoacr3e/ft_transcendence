
services:
  nginx:
    image: nginx
    container_name: nginx
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
  backend:
    image: backend
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.be
    env_file:
      - .env
    volumes:
      - ./backend_dir/scacchi:/app
      - /app/node_modules

  frontend:
    image: frontend
    container_name: frontend
    # ports:
    #   - "5173:5173"
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile.fe
    volumes:
      - ./frontend_dir:/app
      - /app/node_modules