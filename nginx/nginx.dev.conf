
server {
	listen 80;
	server_name localhost;

	# frontend fa proxy verso Vite server
	location / {
		proxy_pass http://frontend:5173;
		proxy_http_version 1.1; # upgrade a WS richiede http/1.1
		proxy_set_header Upgrade $http_upgrade; # server a permettere protocollo HMR tramite WS
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host; # passa a Vite l'host originale
	}

	location /@vite/client { # endpoint che Vite usa lato client per il canale HMR (file JS nell'HTML che apre la connessione websocket)
	# si usano stesse righe di / così da garantire upgrade anche in caso di cambio alla location /
		proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
	}

	location /api/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
	}

	location /auth/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
	}

	location /socket.io/ {
		proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # questa volta non per Vite ma per la comunicazione tra client e server
	}
}