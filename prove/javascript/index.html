<!DOCTYPE html>
<html>
<body>

<button id="go">RUN</button>
<pre id="out"></pre>

<script>

function log(msg){
 document.getElementById("out").innerHTML += msg + "\n";
}

function wait(ms){
 return new Promise(resolve => {
   setTimeout(() => {
     log("timer finished " + ms);
     resolve(ms);
   }, ms);
 });
}

async function test(){

await wait(1000);
wait(500);
await wait(0);

}

document.getElementById("go").addEventListener("click", test);

</script>
</body>
</html>
