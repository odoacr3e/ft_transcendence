<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Gameplay - Multi Client Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #302e2b;
            --card-bg: #262522;
            --accent-green: #81b64c;
            --accent-green-hover: #a3d16c;
            --text-color: #ffffff;
            --text-muted: #bababa;
            --border-color: #403e3b;
            --table-light: #dad8d6;
            --accent-red: #ff4d4d;
            --accent-blue: #2980b9;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 1300px;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: #fff;
            text-align: center;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #333;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #1a1917;
            color: var(--text-muted);
            padding: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        tr:nth-child(even) { background-color: var(--table-light); }
        tr:nth-child(odd) { background-color: #b5c3a7; }

        td {
            padding: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            vertical-align: middle;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            background-color: var(--accent-red);
        }

        .status-badge.connected { background-color: var(--accent-green); }

        .btn-action {
            background-color: #312e2b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .btn-action:hover { background-color: #45413d; }
        .btn-disconnect { background-color: #5c2727; }
        .btn-disconnect:hover { background-color: #7a3535; }

        /* Stili per il Form di invio mosse in linea */
        .game-controls {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .game-controls input[type="text"] {
            width: 50px;
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            text-align: center;
            font-weight: bold;
        }

        .game-controls select {
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
        }

        .btn-send {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-send:hover { background-color: #3498db; }

        /* Badge di Risposta dei socket.on */
        .response-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
        }
        .res-ok { background-color: var(--accent-green); }
        .res-err { background-color: var(--accent-red); }

        /* Box globale per gli errori severi log.msg */
        #global-error-log {
            width: 100%;
            max-width: 1300px;
            background-color: #5c2727;
            border: 2px solid var(--accent-red);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            box-sizing: border-box;
            display: none;
        }
        #global-error-log h3 { margin-top: 0; color: #ff4d4d; }
        #error-list { padding-left: 1.2rem; margin: 0; color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>⚔️ Chess Gameplay Test Bench (Stanza Attiva)</h2>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Stato</th>
                        <th>Username (ID Match)</th>
                        <th>points</th>
                        <th>Invia Mossa ({from, to, type})</th>
                        <th>Ultimo Esito ON</th>
                        <th>Timer Test</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody id="game-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <div id="global-error-log">
        <h3>🚨 Log Errori Ricevuti (status != 200)</h3>
        <ul id="error-list"></ul>
    </div>

    <script>
        // Recuperiamo i dati passati dal primo HTML (usiamo localStorage per semplicità di trasporto massivo)
        const clientIniziali = JSON.parse(localStorage.getItem('attiva_gameplay_clients')) || [];
        const clientSimulati = [];

        // Inizializzazione automatica dei client ereditati
        if(clientIniziali.length === 0) {
            document.getElementById('game-table-body').innerHTML = `<tr><td colspan="7" style="text-align:center; color:white; background:#262522; padding:2rem;">Nessun client in partita. Avvia un match dal Test Bench precedente.</td></tr>`;
        } else {
            clientIniziali.forEach(c => creaRigaClientGameplay(c.dati, c.matchId));
        }

        function creaRigaClientGameplay(datiUtente, matchId) {
            // --- RICONNESSIONE DEL WEBSOCKET ---
            const socket = io("http://localhost:8080", {
                auth: datiUtente,
                forceNew: true,
                transports: ['websocket', 'polling']
            });

            const clientObj = {
                dati: datiUtente,
                socket: socket,
                matchId: matchId,
                countdownInterval: null
            };
            clientSimulati.push(clientObj);

            const tbody = document.getElementById('game-table-body');
            const tr = document.createElement('tr');
            tr.id = `row-${datiUtente.id_user}`;
            
            tr.innerHTML = `
                <td><span id="badge-${datiUtente.id_user}" class="status-badge">Connecting</span></td>
                <td><strong>${datiUtente.username}</strong><br><small style="color:#444; font-family:monospace;">MID: ${matchId}</small></td>
                <td>🎯 ${datiUtente.points}</td>
                <td>
                    <div class="game-controls">
                        <input type="text" id="from-${datiUtente.id_user}" placeholder="e2" maxlength="4">
                        <input type="text" id="to-${datiUtente.id_user}" placeholder="e4" maxlength="4">
                        <select id="type-${datiUtente.id_user}">
                            <option value="move">move</option>
                            <option value="moveBoost">moveBoost</option>
                            <option value="boost">boost</option>
                            <option value="transform">transform</option>
                            <option value="endTurn">endTurn</option>
                        </select>
                        <button class="btn-send" onclick="inviaMossa('${datiUtente.id_user}')">Invia</button>
                    </div>
                </td>
                <td id="esito-${datiUtente.id_user}">-</td>
                <td id="timer-cell-${datiUtente.id_user}">-</td>
                <td>
                    <button class="btn-action btn-disconnect" id="btn-toggle-${datiUtente.id_user}" onclick="toggleConnessione('${datiUtente.id_user}')">Stacca Socket</button>
                </td>
            `;
            tbody.appendChild(tr);

            // --- CONFIGURAZIONE DEGLI ASCOLTATORI EVENTI ON ---
            const eventiMossa = ["move", "moveBoost", "boost", "transform", "endTurn"];
            
            eventiMossa.forEach(eventType => {
                socket.on(eventType, (data) => {
                    gestisciRispostaServer(datiUtente.id_user, eventType, data);
                });
            });

            // Gestione Grafica Connessione
            socket.on('connect', () => {
                document.getElementById(`badge-${datiUtente.id_user}`).innerText = "Connected";
                document.getElementById(`badge-${datiUtente.id_user}`).classList.add('connected');
                document.getElementById(`btn-toggle-${datiUtente.id_user}`).innerText = "Stacca Socket";
                document.getElementById(`btn-toggle-${datiUtente.id_user}`).style.backgroundColor = "#5c2727";
                document.getElementById(`timer-cell-${datiUtente.id_user}`).innerText = "-";
                clearInterval(clientObj.countdownInterval);
            });

            socket.on('disconnect', () => {
                document.getElementById(`badge-${datiUtente.id_user}`).innerText = "Disconnected";
                document.getElementById(`badge-${datiUtente.id_user}`).classList.remove('connected');
                document.getElementById(`btn-toggle-${datiUtente.id_user}`).innerText = "Attacca Socket";
                document.getElementById(`btn-toggle-${datiUtente.id_user}`).style.backgroundColor = "var(--accent-green)";

                let secondiPassati = 0;
                clearInterval(clientObj.countdownInterval);
                clientObj.countdownInterval = setInterval(() => {
                    secondiPassati++;
                    document.getElementById(`timer-cell-${datiUtente.id_user}`).innerText = `Fuori da: ${secondiPassati}s`;
                }, 1000);
            });
        }

        // --- INVIO DELLA MOSSA AL SERVER ---
        function inviaMossa(idUser) {
            const client = clientSimulati.find(c => c.dati.id_user == idUser);
            if (!client || !client.socket.connected) {
                alert("Client non connesso!");
                return;
            }

            // RESET: azzeriamo l'esito visivo prima di mandare il nuovo input
            document.getElementById(`esito-${idUser}`).innerHTML = "-";

            const fromVal = document.getElementById(`from-${idUser}`).value;
            const toVal = document.getElementById(`to-${idUser}`).value;
            const typeVal = document.getElementById(`type-${idUser}`).value;

            const payload = {
                from: fromVal,
                to: toVal,
                type: typeVal
            };

            client.socket.emit("game", payload);
            console.log(`evento [game] Inviato da ${client.dati.username}:`, payload);
        }

        // --- GESTIONE DELLE RISPOSTE RICEVUTE SUI SOCKET.ON ---
        function gestisciRispostaServer(idUser, eventType, data) {
            const esitoCell = document.getElementById(`esito-${idUser}`);
            console.log(`[ON ${eventType}] Ricevuto per utente ${idUser}:`, data);

            // Controllo standard impostato: data.log.status
            if (data && data.log && data.log.status === 200) {
                esitoCell.innerHTML = `<span class="response-badge res-ok">OK (${eventType})</span>`;
            } else {
                // Se lo status non è 200 o l'oggetto è malformato, mostriamo ERRORE
                esitoCell.innerHTML = `<span class="response-badge res-err">ERRORE (${eventType})</span>`;
                
                // Estraiamo la stringa log.msg
                const errorMsg = (data && data.log && data.log.msg) ? data.log.msg : "Errore generico non specificato";
                
                // Mostriamo il box globale ed appendiamo l'errore
                const errorLogBox = document.getElementById('global-error-log');
                const errorList = document.getElementById('error-list');
                errorLogBox.style.display = 'block';
                
                const li = document.createElement('li');
                li.innerHTML = `<strong>Utente ${idUser} (${eventType}):</strong> ${errorMsg} (Status: ${data?.log?.status || 'N/A'})`;
                errorList.prepend(li); // Mette l'ultimo errore in cima
            }
        }

        function toggleConnessione(idUser) {
            const client = clientSimulati.find(c => c.dati.id_user == idUser);
            if (!client) return;

            if (client.socket.connected) {
                client.socket.disconnect();
            } else {
                client.socket.connect();
            }
        }
    </script>
</body>
</html>
